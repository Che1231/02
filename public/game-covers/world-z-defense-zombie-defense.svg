<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主渐变 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7950F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6741D9;stop-opacity:1" />
    </linearGradient>

    <!-- 网格图案 -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 背景渐变 -->
  <rect width="1280" height="720" fill="url(#mainGradient)"/>

  <!-- 网格 -->
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- 装饰圆圈 -->
  <circle cx="1024" cy="216" r="200" fill="rgba(255,255,255,0.08)"/>
  <circle cx="256" cy="503.99999999999994" r="150" fill="rgba(255,255,255,0.08)"/>

  <!-- 中心卡片 -->
  <rect x="192" y="180"
        width="896" height="360"
        rx="30" fill="rgba(255,255,255,0.15)"
        filter="drop-shadow(0 20px 40px rgba(0,0,0,0.3))"/>

  <!-- 游戏图标 -->
  <text x="640" y="300"
        font-size="120" font-family="Arial, sans-serif"
        text-anchor="middle" fill="rgba(255,255,255,0.9)">🎮</text>

  <!-- 游戏标题 -->
  <text x="640" y="440"
        font-size="48" font-weight="bold" font-family="Arial, sans-serif"
        text-anchor="middle" fill="#FFFFFF"
        filter="drop-shadow(0 5px 10px rgba(0,0,0,0.5))">World Z Defense - Zombie Defense</text>

  <!-- 分类标签 -->
  

  <!-- 底部装饰线 -->
  <line x1="292" y1="500"
        x2="988" y2="500"
        stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
</svg>